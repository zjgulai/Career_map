# /etc/nginx/conf.d/native.sagegogo.com.conf
# 三宝 · 一体化 3D 组织与经营网络空间（宿主机 Nginx 反代 -> 127.0.0.1:8088 容器）
# 与同机 sagegogo.com.conf / shopify.aibobod.com.conf 保持同构，互不干扰。

server {
    listen 80;
    listen [::]:80;
    server_name native.sagegogo.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://native.sagegogo.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name native.sagegogo.com;

    ssl_certificate     /etc/letsencrypt/live/native.sagegogo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/native.sagegogo.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    access_log /var/log/nginx/native.sagegogo.com.access.log;
    error_log  /var/log/nginx/native.sagegogo.com.error.log warn;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location = / {
        return 302 https://native.sagegogo.com/src/orgmap/$is_args$args;
    }

    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 65s;
    }

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
