server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        image/svg+xml;

    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"sanbao-orgmap-3d"}';
    }

    # 根路径默认进入三宝一体化 3D 组织与经营网络空间（保留查询参数）
    location = / {
        return 302 /src/orgmap/$is_args$args;
    }

    # 静态头像、Three.js vendor 与带版本号脚本启用强缓存
    location ~* \.(webp|png|jpg|jpeg|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # HTML 入口协商缓存，确保更新即时生效
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
