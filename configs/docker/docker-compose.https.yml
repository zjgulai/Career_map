services:
  sanbao-caddy:
    image: caddy:2.8-alpine
    container_name: sanbao-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - SANBAO_DOMAIN=${SANBAO_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - sanbao-orgmap
    security_opt:
      - no-new-privileges:true

volumes:
  caddy_data:
  caddy_config:
